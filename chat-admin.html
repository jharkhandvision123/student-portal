<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Chat Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#e5ddd5;
}

.header{
    background:#075e54;
    color:white;
    padding:18px;
    text-align:center;
    font-size:21px;
    font-weight:bold;
}

.container{
    max-width:900px;
    margin:auto;
    height:calc(100vh - 70px);
    display:flex;
    background:white;
}

.users{
    width:280px;
    border-right:1px solid #ddd;
    overflow-y:auto;
    background:#f7f7f7;
}

.users-title{
    padding:15px;
    background:#eee;
    font-weight:bold;
}

.user{
    padding:15px;
    border-bottom:1px solid #ddd;
    cursor:pointer;
    background:white;
}

.user:hover{
    background:#f1f1f1;
}

.user.active{
    background:#dcf8c6;
}

.online{
    color:green;
    font-size:12px;
}

.chat{
    flex:1;
    display:flex;
    flex-direction:column;
}

.chat-header{
    padding:15px;
    background:#f0f0f0;
    border-bottom:1px solid #ddd;
    font-weight:bold;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:15px;
    background:#e5ddd5;
}

.message{
    max-width:75%;
    padding:10px 13px;
    margin:7px 0;
    border-radius:10px;
    word-wrap:break-word;
}

.user-message{
    background:white;
    margin-right:auto;
}

.admin-message{
    background:#dcf8c6;
    margin-left:auto;
}

.time{
    display:block;
    font-size:10px;
    color:#777;
    text-align:right;
    margin-top:4px;
}

.input-area{
    display:flex;
    gap:8px;
    padding:10px;
    background:#f0f0f0;
}

.input-area input{
    flex:1;
    border:none;
    outline:none;
    padding:13px;
    border-radius:25px;
    font-size:15px;
}

.input-area button{
    width:50px;
    height:50px;
    border:none;
    border-radius:50%;
    background:#075e54;
    color:white;
    font-size:20px;
    cursor:pointer;
}

.no-user{
    padding:25px;
    text-align:center;
    color:#777;
}

.status{
    padding:6px;
    text-align:center;
    font-size:12px;
    background:#f5f5f5;
}

@media(max-width:650px){

    .users{
        width:120px;
    }

    .user{
        padding:10px;
        font-size:12px;
    }

}

</style>

</head>

<body>


<div class="header">
    💬 Chat Admin
</div>


<div class="container">


    <!-- USERS -->

    <div class="users">

        <div class="users-title">
            Users
        </div>

        <div id="usersList">

            <div class="no-user">
                कोई user online नहीं है।
            </div>

        </div>

    </div>


    <!-- CHAT -->

    <div class="chat">

        <div
            class="chat-header"
            id="chatHeader"
        >
            किसी user को select करें
        </div>


        <div
            class="status"
            id="status"
        >
            Connecting...
        </div>


        <div
            class="messages"
            id="messages"
        >
        </div>


        <div class="input-area">

            <input
                type="text"
                id="messageInput"
                placeholder="Type reply..."
                autocomplete="off"
            >

            <button
                id="sendBtn"
            >
                ➤
            </button>

        </div>

    </div>

</div>


<script>


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://aghizlgvrhunpuxvohep.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_gpc7KUqUIykO3WM1aCzRfg_Myo8AKyx";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   ADMIN CHANNEL
========================================= */

const adminChannel =
    supabaseClient.channel(
        "chat-admin-control",
        {
            config:{
                presence:{
                    key:"admin"
                }
            }
        }
    );


/* =========================================
   VARIABLES
========================================= */

let selectedRoomId = null;

let selectedChannel = null;


/* =========================================
   ADMIN CONNECT
========================================= */

adminChannel.subscribe(
    async function(status){

        const statusBox =
            document.getElementById("status");

        if(status === "SUBSCRIBED"){

            statusBox.textContent =
                "🟢 Admin Connected";

        }
        else{

            statusBox.textContent =
                "Connecting...";

        }

    }
);


/* =========================================
   MESSAGE SEND
========================================= */

document
.getElementById("sendBtn")
.addEventListener(
    "click",
    sendAdminMessage
);


document
.getElementById("messageInput")
.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            sendAdminMessage();

        }

    }
);


async function sendAdminMessage(){

    if(!selectedChannel){

        alert(
            "पहले किसी user को select करें।"
        );

        return;

    }


    const input =
        document.getElementById(
            "messageInput"
        );


    const message =
        input.value.trim();


    if(!message){

        return;

    }


    await selectedChannel.send({

        type:"broadcast",

        event:"admin-message",

        payload:{

            roomId:selectedRoomId,

            message:message,

            time:new Date().toISOString()

        }

    });


    addMessage(
        message,
        "admin-message"
    );


    input.value = "";

}


/* =========================================
   OPEN USER CHAT
========================================= */

function openUser(roomId){

    selectedRoomId =
        roomId;


    document
    .getElementById("chatHeader")
    .textContent =
        "💬 User Chat";


    document
    .getElementById("messages")
    .innerHTML = "";


    if(selectedChannel){

        supabaseClient.removeChannel(
            selectedChannel
        );

    }


    selectedChannel =
        supabaseClient.channel(
            "temporary-chat-" + roomId,
            {
                config:{
                    broadcast:{
                        self:false
                    }
                }
            }
        );


    selectedChannel.on(
        "broadcast",
        {
            event:"user-message"
        },
        function(payload){

            if(
                payload &&
                payload.payload &&
                payload.payload.roomId === roomId
            ){

                addMessage(
                    payload.payload.message,
                    "user-message"
                );

            }

        }
    );


    selectedChannel.subscribe(
        function(status){

            if(status === "SUBSCRIBED"){

                document
                .getElementById("status")
                .textContent =
                    "🟢 Connected to user";

            }

        }
    );

}


/* =========================================
   SHOW MESSAGE
========================================= */

function addMessage(
    message,
    type
){

    const messages =
        document.getElementById(
            "messages"
        );


    const div =
        document.createElement(
            "div"
        );


    div.className =
        "message " + type;


    div.innerHTML =
        escapeHtml(message) +
        `
        <span class="time">
            ${
                new Date().toLocaleTimeString(
                    "en-IN",
                    {
                        hour:"2-digit",
                        minute:"2-digit"
                    }
                )
            }
        </span>
        `;


    messages.appendChild(
        div
    );


    messages.scrollTop =
        messages.scrollHeight;

}


/* =========================================
   SECURITY
========================================= */

function escapeHtml(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


</script>

</body>

</html>
