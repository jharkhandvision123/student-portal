<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Result</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>MJ1 Quiz Result</h1>
<p>JharkhandVision123 Education</p>
</header>

<main>

<div class="box">

<h2>Your Result</h2>

<p><b>Total Questions:</b> <span id="total"></span></p>

<p><b>Correct Answers:</b> <span id="correct"></span></p>

<p><b>Wrong Answers:</b> <span id="wrong"></span></p>

<p><b>Percentage:</b> <span id="percentage"></span>%</p>

<h2 id="status"></h2>

<hr><br>

<h2>Answer Review</h2>

<div id="review"></div>

<br>

<a href="quiz-mj1.html">
<button>🔄 Restart Quiz</button>
</a>

&nbsp;&nbsp;

<a href="index.html">
<button>🏠 Home</button>
</a>

</div>

</main>

<script>

let score = Number(localStorage.getItem("quizScore"));

let questions = JSON.parse(localStorage.getItem("quizQuestions"));

let answers = JSON.parse(localStorage.getItem("quizAnswers"));

let total = questions.length;

let wrong = total - score;

let percentage = ((score/total)*100).toFixed(2);

document.getElementById("total").innerHTML = total;
document.getElementById("correct").innerHTML = score;
document.getElementById("wrong").innerHTML = wrong;
document.getElementById("percentage").innerHTML = percentage;

if(percentage>=40){
document.getElementById("status").innerHTML="✅ PASS";
document.getElementById("status").style.color="green";
}
else{
document.getElementById("status").innerHTML="❌ FAIL";
document.getElementById("status").style.color="red";
}

let review="";

for(let i=0;i<questions.length;i++){

review+=`
<hr>

<h3>Question ${i+1}</h3>

<p><b>${questions[i].question}</b></p>

<p>Your Answer:
${answers[i] ? answers[i] : "Not Answered"}
</p>

<p>Correct Answer:
<span style="color:green;">
${questions[i].answer}
</span>
</p>

`;

}

document.getElementById("review").innerHTML=review;

</script>

</body>

</html>
