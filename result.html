<!DOCTYPE html>
<html>

<head>
    <title>Quiz Result</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>MJ1 Quiz Result</h1>
</header>

<main>

<div class="box">

    <h2>Your Score</h2>

    <h1 id="score"></h1>

    <p id="status"></p>

    <br>

    <a href="quiz-mj1.html">
        <button>🔄 Restart Quiz</button>
    </a>

</div>

</main>

<script>

let score = localStorage.getItem("quizScore");

let total = 3;

document.getElementById("score").innerHTML =
score + " / " + total;

if(score >= 2){
    document.getElementById("status").innerHTML =
    "✅ Pass";
}
else{
    document.getElementById("status").innerHTML =
    "❌ Fail";
}

</script>

</body>

</html>
