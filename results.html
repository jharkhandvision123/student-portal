<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MJ1 Quiz Result</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>MJ1 Quiz Result</h1>
<p>JharkhandVision123 Education</p>
</header>

<main>

<div class="box">

<h2>Quiz Completed</h2>

<p><b>Total Questions:</b> <span id="total"></span></p>

<p><b>Correct Answers:</b> <span id="correct"></span></p>

<p><b>Wrong Answers:</b> <span id="wrong"></span></p>

<p><b>Percentage:</b> <span id="percentage"></span>%</p>

<h2 id="status"></h2>

<hr>

<h2>Answer Review</h2>

<div id="review"></div>

<br>

<a href="quiz-mj1.html">
<button>🔄 Restart Quiz</button>
</a>

&nbsp;

<a href="index.html">
<button>🏠 Home</button>
</a>

</div>

</main>

<script>

const score = Number(localStorage.getItem("quizScore")) || 0;

const questions = JSON.parse(localStorage.getItem("quizQuestions") || "[]");

const answers = JSON.parse(localStorage.getItem("quizAnswers") || "[]");

const total = questions.length;

document.getElementById("total").innerText = total;
document.getElementById("correct").innerText = score;
document.getElementById("wrong").innerText = total - score;

const percentage = total > 0 ? ((score / total) * 100).toFixed(2) : 0;

document.getElementById("percentage").innerText = percentage;

if (percentage >= 40) {
    document.getElementById("status").innerHTML = "✅ PASS";
    document.getElementById("status").style.color = "green";
} else {
    document.getElementById("status").innerHTML = "❌ FAIL";
    document.getElementById("status").style.color = "red";
}

let html = "";

for(let i = 0; i < questions.length; i++){

    const studentAnswer = answers[i] || "Not Answered";
    const correctAnswer = questions[i].answer;

    html += `
    <div style="border:1px solid #ddd;padding:15px;margin:15px 0;border-radius:8px;">
        <h3>Question ${i+1}</h3>

        <p><b>${questions[i].question}</b></p>

        <p>
        <b>Your Answer:</b>
        <span style="color:${studentAnswer===correctAnswer?'green':'red'}">
        ${studentAnswer}
        </span>
        </p>

        <p>
        <b>Correct Answer:</b>
        <span style="color:green">
        ${correctAnswer}
        </span>
        </p>

    </div>
    `;

}

document.getElementById("review").innerHTML = html;

</script>

</body>

</html>
