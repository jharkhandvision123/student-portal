<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    background:#e5ddd5;
}

.header{
    background:#075e54;
    color:white;
    padding:16px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
}

.chat-box{
    max-width:700px;
    height:calc(100vh - 125px);
    margin:auto;
    display:flex;
    flex-direction:column;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:15px;
}

.message{
    max-width:75%;
    padding:10px 13px;
    margin:7px 0;
    border-radius:10px;
    font-size:15px;
    line-height:1.4;
    word-wrap:break-word;
}

.user{
    margin-left:auto;
    background:#dcf8c6;
    border-top-right-radius:2px;
}

.admin{
    margin-right:auto;
    background:white;
    border-top-left-radius:2px;
}

.time{
    display:block;
    font-size:10px;
    color:#777;
    text-align:right;
    margin-top:3px;
}

.input-area{
    display:flex;
    padding:10px;
    background:#f0f0f0;
    gap:8px;
}

.input-area input{
    flex:1;
    border:none;
    padding:13px;
    border-radius:25px;
    outline:none;
    font-size:15px;
}

.input-area button{
    width:50px;
    height:50px;
    border:none;
    border-radius:50%;
    background:#075e54;
    color:white;
    font-size:20px;
    cursor:pointer;
}

.status{
    text-align:center;
    font-size:12px;
    padding:5px;
    background:#f5f5f5;
    color:#777;
}

</style>

</head>


<body>


<div class="header">
    💬 Chat
</div>


<div class="chat-box">


    <div
        class="status"
        id="status"
    >
        Connecting...
    </div>


    <div
        class="messages"
        id="messages"
    >
    </div>


    <div class="input-area">

        <input
            type="text"
            id="messageInput"
            placeholder="Type a message..."
            autocomplete="off"
        >


        <button
            id="sendBtn"
            type="button"
        >
            ➤
        </button>

    </div>


</div>


<script>


/* =========================================
   SUPABASE CONFIG
========================================= */

const SUPABASE_URL =
    "https://aghizlgvrhunpuxvohep.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_gpc7KUqUIykO3WM1aCzRfg_Myo8AKyx";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   TEMPORARY ROOM ID
========================================= */

let roomId =
    sessionStorage.getItem(
        "temporary_chat_room"
    );


if(!roomId){

    roomId =
        crypto.randomUUID();

    sessionStorage.setItem(
        "temporary_chat_room",
        roomId
    );

}


/* =========================================
   USER CHAT CHANNEL
========================================= */

const chatChannel =
    supabaseClient.channel(
        "temporary-chat-" + roomId,
        {
            config:{
                broadcast:{
                    self:false
                }
            }
        }
    );


/* =========================================
   USER PRESENCE / ONLINE LIST
========================================= */

const lobbyChannel =
    supabaseClient.channel(
        "chat-online-users",
        {
            config:{
                presence:{
                    key:roomId
                }
            }
        }
    );


/* =========================================
   CHAT CONNECTION
========================================= */

chatChannel
.subscribe(function(status){

    const statusBox =
        document.getElementById(
            "status"
        );


    if(status === "SUBSCRIBED"){

        statusBox.textContent =
            "🟢 Connected";

    }
    else{

        statusBox.textContent =
            "Connecting...";

    }

});


/* =========================================
   ADMIN REPLY RECEIVE
========================================= */

chatChannel.on(
    "broadcast",
    {
        event:"admin-message"
    },
    function(payload){

        if(
            payload &&
            payload.payload &&
            payload.payload.roomId === roomId
        ){

            addMessage(
                payload.payload.message,
                "admin"
            );

        }

    }
);


/* =========================================
   USER ONLINE
========================================= */

lobbyChannel
.subscribe(async function(status){

    if(status === "SUBSCRIBED"){

        await lobbyChannel.track({

            roomId:roomId,

            type:"user",

            online:true,

            joinedAt:
                new Date().toISOString()

        });

    }

});


/* =========================================
   SEND USER MESSAGE
========================================= */

async function sendMessage(){

    const input =
        document.getElementById(
            "messageInput"
        );


    const message =
        input.value.trim();


    if(!message){

        return;

    }


    addMessage(
        message,
        "user"
    );


    input.value = "";


    try{

        await chatChannel.send({

            type:"broadcast",

            event:"user-message",

            payload:{

                roomId:roomId,

                message:message,

                time:
                    new Date().toISOString()

            }

        });

    }
    catch(error){

        console.error(
            "Message Send Error:",
            error
        );

    }

}


/* =========================================
   ADD MESSAGE
========================================= */

function addMessage(
    message,
    type
){

    const messages =
        document.getElementById(
            "messages"
        );


    const div =
        document.createElement(
            "div"
        );


    div.className =
        "message " + type;


    const safeMessage =
        escapeHtml(message);


    const time =
        new Date().toLocaleTimeString(
            "en-IN",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );


    div.innerHTML =
        safeMessage +
        `<span class="time">${time}</span>`;


    messages.appendChild(
        div
    );


    messages.scrollTop =
        messages.scrollHeight;

}


/* =========================================
   SEND BUTTON
========================================= */

document
.getElementById("sendBtn")
.addEventListener(
    "click",
    sendMessage
);


/* =========================================
   ENTER KEY
========================================= */

document
.getElementById("messageInput")
.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================================
   SECURITY
========================================= */

function escapeHtml(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================
   CLEAN UP WHEN PAGE CLOSES
========================================= */

window.addEventListener(
    "beforeunload",
    function(){

        try{

            lobbyChannel.untrack();

        }
        catch(error){

            console.log(error);

        }

    }
);

</script>


</body>

</html>
