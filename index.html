<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Student Portal</title>

<style>

/* ================================
   BASIC RESET
================================ */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


/* ================================
   FONT
================================ */

body{
    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:#f4f7fb;
    color:#222;
}


/* ================================
   HEADER
================================ */

header{
    background:#0d47a1;
    color:white;
    padding:22px 15px;
    text-align:center;
}

header h1{
    font-size:28px;
    margin-bottom:6px;
}

header p{
    font-size:14px;
    opacity:.9;
}


/* ================================
   MAIN CONTAINER
================================ */

.container{
    width:92%;
    max-width:700px;
    margin:30px auto;
}


/* ================================
   WELCOME BOX
================================ */

.welcome-box{
    background:white;
    padding:25px;
    border-radius:14px;
    box-shadow:
        0 4px 15px rgba(0,0,0,.08);

    text-align:center;
    margin-bottom:25px;
}

.welcome-box h2{
    color:#0d47a1;
    font-size:23px;
    margin-bottom:10px;
}

.welcome-box p{
    color:#666;
    font-size:15px;
    line-height:1.5;
}


/* ================================
   CHAT BUTTON
================================ */

.chat-button{
    display:block;
    width:100%;

    background:#075e54;
    color:white;

    text-decoration:none;

    padding:16px;

    border-radius:10px;

    text-align:center;

    font-size:18px;
    font-weight:bold;

    box-shadow:
        0 4px 10px rgba(0,0,0,.12);

    transition:
        .2s ease;
}

.chat-button:hover{
    transform:translateY(-2px);

    box-shadow:
        0 6px 14px rgba(0,0,0,.18);
}


/* ================================
   FOOTER
================================ */

footer{
    text-align:center;
    color:#777;
    font-size:13px;
    padding:25px 10px;
}


/* ================================
   MOBILE
================================ */

@media(max-width:500px){

    header h1{
        font-size:23px;
    }

    .container{
        width:94%;
        margin-top:20px;
    }

    .welcome-box{
        padding:20px;
    }

}

</style>

</head>


<body>


<!-- ================================
     HEADER
================================ -->

<header>

    <h1>Student Portal</h1>

    <p>Welcome to Student Portal</p>

</header>


<!-- ================================
     MAIN
================================ -->

<div class="container">


    <div class="welcome-box">

        <h2>
            Welcome to Student Portal
        </h2>

        <p>
            Connect with us through Chat
            for assistance and communication.
        </p>

    </div>


    <!-- ============================
         CHAT BUTTON
    ============================= -->

    <a
        href="chat.html"
        class="chat-button"
    >
        💬 Chat
    </a>


</div>


<!-- ================================
     FOOTER
================================ -->

<footer>

    © 2026 Student Portal

</footer>


<!-- ================================
     JAVASCRIPT
================================ -->

<script>

/*
   अभी इस page के लिए
   किसी external JavaScript file
   की आवश्यकता नहीं है.
*/

console.log(
    "Student Portal loaded successfully."
);

</script>


</body>

</html>
