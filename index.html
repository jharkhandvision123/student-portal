<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Print System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #111827;
        }

        header {
            background: linear-gradient(90deg, #ff9933, #ffffff, #138808);
            padding: 22px 15px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        .container {
            max-width: 900px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .search-area {
            display: flex;
            gap: 10px;
        }

        .search-box {
            flex: 1;
            padding: 15px;
            font-size: 18px;
            border: 1px solid #aaa;
            border-radius: 10px;
            outline: none;
        }

        .search-button {
            background: #2563eb;
            color: white;
            padding: 0 25px;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            cursor: pointer;
        }

        .search-button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 15px;
        }

        .option {
            background: white;
            padding: 16px;
            margin-bottom: 10px;
            border-radius: 10px;
            border: 1px solid #ddd;
            cursor: pointer;
        }

        .option:hover {
            background: #f0f7ff;
        }

        .option strong {
            display: block;
            font-size: 18px;
        }

        .option small {
            color: #666;
        }

        .editor {
            display: none;
            margin-top: 20px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #ddd;
        }

        .editor h2 {
            margin-top: 0;
        }

        .info {
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            line-height: 1.8;
        }

        .upload-box {
            border: 2px dashed #2563eb;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            background: #eff6ff;
        }

        .upload-box label {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 13px 22px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 17px;
        }

        .upload-box input {
            display: none;
        }

        .file-name {
            margin-top: 10px;
            color: #374151;
        }

        .message {
            margin-top: 10px;
            color: #dc2626;
            font-weight: bold;
        }

        .preview-title {
            margin-top: 25px;
            margin-bottom: 10px;
        }

        .a4-preview {
            width: 210mm;
            height: 297mm;
            background: white;
            margin: auto;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 8px rgba(0,0,0,0.2);
        }

        .photo {
            position: absolute;
            object-fit: cover;
        }

        .print-btn {
            background: #16a34a;
            color: white;
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
        }

        .print-btn:hover {
            background: #15803d;
        }

        @media (max-width: 750px) {
            .search-area {
                flex-direction: column;
            }

            .search-button {
                padding: 14px;
            }

            .a4-preview {
                transform-origin: top left;
                transform: scale(0.45);
                margin-bottom: -160mm;
            }
        }

        @media print {
            @page {
                size: A4 portrait;
                margin: 0;
            }

            body {
                background: white;
            }

            header,
            .search-area,
            .result,
            .info,
            .upload-box,
            .editor h2,
            .preview-title,
            .print-btn,
            .message {
                display: none !important;
            }

            .container {
                margin: 0;
                padding: 0;
                max-width: none;
            }

            .editor {
                display: block !important;
                margin: 0;
                padding: 0;
                border: none;
            }

            .a4-preview {
                width: 210mm;
                height: 297mm;
                margin: 0;
                box-shadow: none;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Photo Print System</h1>
</header>

<div class="container">

            autocomplete="off"
        >

        <button
            class="search-button"
            onclick="searchDocument()"
        >
            Search
        </button>

    </div>

    <div id="result" class="result"></div>

    <div id="editor" class="editor">

        <h2 id="documentTitle"></h2>

        <div class="info">
            <div>
                <strong>Official Size:</strong>
                <span id="documentSize"></span>
            </div>

            <div>
                <strong>A4 में फोटो:</strong>
                <span id="photoCount"></span>
            </div>
        </div>

        <div class="upload-box">

            <label for="photoInput">
                📷 फोटो Upload करें
            </label>

            <input
                type="file"
                id="photoInput"
                accept="image/*"
            >

            <div
                id="fileName"
                class="file-name"
