
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#075e54">
<title>Chat - Messaging</title>

<style>
*{box-sizing:border-box}
:root{--green:#075e54;--lightgreen:#128c7e;--bg:#e9edef}
body{margin:0;font-family:Arial,"Noto Sans Devanagari",sans-serif;background:var(--bg);color:#222}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{height:100dvh;max-width:1500px;margin:auto;display:flex;background:white;overflow:hidden}
.sidebar{width:360px;max-width:100%;border-right:1px solid #ddd;display:flex;flex-direction:column;flex-shrink:0}
.header{height:62px;background:var(--green);color:white;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-size:21px;font-weight:bold}
.iconbtn{border:0;background:transparent;color:inherit;font-size:22px;padding:7px;border-radius:50%}
.iconbtn:hover{background:#ffffff20}
.search{padding:12px;background:#f7f8fa}
.search input{width:100%;border:0;outline:0;border-radius:9px;padding:12px;background:white}
.contactlist{overflow-y:auto;flex:1}
.contact{display:flex;align-items:center;gap:12px;padding:13px 12px;border-bottom:1px solid #f0f0f0;cursor:pointer}
.contact:hover,.contact.active{background:#e9edef}
.avatar{height:46px;width:46px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:#d8eee9;color:#075e54;font-size:20px;font-weight:bold}
.contactinfo{min-width:0;flex:1}
.contactname{font-weight:bold;margin-bottom:6px}
.preview{font-size:13px;color:#667781;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.emptycontacts{text-align:center;padding:35px 18px;color:#667781;line-height:1.7}
.chatpanel{flex:1;min-width:0;display:flex;flex-direction:column;background:#efeae2}
.chatheader{background:var(--green);color:white;padding:8px 14px;display:flex;align-items:center;gap:10px;min-height:62px}
.chatheader .avatar{height:42px;width:42px;background:#d8eee9}
.chatheading{flex:1;min-width:0}
.chatheading strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chatheading small{display:block;margin-top:4px;opacity:.8}
.backbtn{display:none}
.messages{flex:1;overflow-y:auto;padding:20px clamp(10px,4vw,60px);display:flex;flex-direction:column;gap:9px;background-color:#efeae2;background-image:radial-gradient(#d9d3c8 0.7px,transparent .7px);background-size:18px 18px}
.welcome{margin:auto;background:#fff;padding:22px;border-radius:12px;text-align:center;max-width:390px;line-height:1.7;color:#53636a}
.daylabel{align-self:center;background:#fff9df;color:#54656d;font-size:12px;padding:6px 12px;border-radius:7px;margin:4px}
.bubble{max-width:min(78%,540px);padding:9px 11px 6px;background:#fff;border-radius:9px;box-shadow:0 1px 1px #0001;overflow-wrap:anywhere;align-self:flex-start;white-space:pre-wrap}
.bubble.outgoing{align-self:flex-end;background:#d9fdd3}
.bubble img{display:block;max-width:100%;max-height:320px;object-fit:contain;border-radius:5px;margin-bottom:6px}
.bubble a{color:#075e54;overflow-wrap:anywhere}
.msgtime{font-size:10px;color:#667781;text-align:right;margin-top:5px}
.composer{background:#f0f2f5;padding:10px;display:flex;align-items:flex-end;gap:8px}
.composer textarea{flex:1;resize:none;min-height:44px;max-height:120px;border:0;outline:0;padding:13px;border-radius:12px;background:white}
.sendbtn{height:44px;min-width:48px;border:0;border-radius:50%;background:var(--green);color:white;font-size:20px}
.fileinput{display:none}
.filebtn{color:#54656f;font-size:24px;border:0;background:transparent;padding:8px}
.filehint{font-size:11px;color:#667781;padding:0 14px 8px;background:#f0f2f5}
.welcomearea{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px;color:#667781}
.welcomearea h2{color:#075e54;font-weight:400}
.welcomearea .big{font-size:70px}
.mobile-only{display:none}
.notice{font-size:12px;text-align:center;padding:7px;color:#6c757d;background:#f7f8fa}
@media(max-width:650px){
 .sidebar{width:100%;border:0}
 .chatpanel{display:none;width:100%}
 .app.chat-open .sidebar{display:none}
 .app.chat-open .chatpanel{display:flex}
 .backbtn{display:block}
 .mobile-only{display:block}
 .messages{padding:14px 10px}
 .bubble{max-width:88%}
}
</style>
</head>

<body>
<div class="app" id="app">

  <aside class="sidebar">
    <div class="header">
      <div class="brand">💬 Chat</div>
      <div>
        <button class="iconbtn" id="newChatBtn" title="नई चैट">＋</button>
        <button class="iconbtn" id="clearBtn" title="सभी लोकल चैट मिटाएँ">⋮</button>
      </div>
    </div>
    <div class="search">
      <input id="searchInput" type="search" placeholder="चैट खोजें...">
    </div>
    <div class="notice">इस ब्राउज़र में सेव होने वाली चैट</div>
    <div class="contactlist" id="contactList"></div>
  </aside>

  <main class="chatpanel" id="chatPanel">
    <div class="welcomearea" id="welcomeArea">
      <div>
        <div class="big">💬</div>
        <h2>आपकी चैट</h2>
        <p>नई चैट शुरू करने के लिए ऊपर ＋ दबाएँ।</p>
        <p>मैसेज और फाइलें इसी ब्राउज़र में सेव होंगी।</p>
      </div>
    </div>

    <section id="conversation" style="display:none;flex:1;min-height:0;flex-direction:column">
      <div class="chatheader">
        <button class="iconbtn backbtn" id="backBtn" aria-label="वापस">‹</button>
        <div class="avatar" id="chatAvatar">C</div>
        <div class="chatheading">
          <strong id="chatName">Chat</strong>
          <small>लोकल चैट</small>
        </div>
        <button class="iconbtn" id="deleteChatBtn" title="यह चैट हटाएँ">🗑</button>
      </div>

      <div class="messages" id="messages">
        <div class="welcome">यह आपकी निजी लोकल चैट है। नीचे मैसेज लिखें।</div>
      </div>

      <div class="composer">
        <label class="filebtn" for="fileInput" title="फोटो या फाइल जोड़ें">＋</label>
        <input class="fileinput" type="file" id="fileInput" multiple
          accept="image/*,video/*,.pdf,.txt,.doc,.docx,.xls,.xlsx,.zip">
        <textarea id="messageInput" rows="1" placeholder="मैसेज लिखें..."></textarea>
        <button class="sendbtn" id="sendBtn" title="मैसेज भेजें">➤</button>
      </div>
      <div class="filehint">Enter = भेजें · Shift+Enter = नई लाइन · फाइलें ब्राउज़र स्टोरेज की सीमा के अधीन हैं</div>
    </section>
  </main>
</div>

<script>
"use strict";

const $ = id => document.getElementById(id);
const app = $("app");

let db;
let activeChat = null;
let contacts = [];
let messages = [];
let pendingFiles = [];
let busy = false;

const DB_NAME = "SingleFileChatDB";
const DB_VERSION = 1;

function openDB(){
  return new Promise((resolve,reject)=>{
    const request = indexedDB.open(DB_NAME,DB_VERSION);
    request.onupgradeneeded = ()=>{
      const d = request.result;
      if(!d.objectStoreNames.contains("contacts")){
        d.createObjectStore("contacts",{keyPath:"id"});
      }
      if(!d.objectStoreNames.contains("messages")){
        const s = d.createObjectStore("messages",{keyPath:"id",autoIncrement:true});
        s.createIndex("chatId","chatId",{unique:false});
      }
    };
    request.onsuccess = ()=>resolve(request.result);
    request.onerror = ()=>reject(request.error);
  });
}

function store(name,mode="readonly"){
  return db.transaction(name,mode).objectStore(name);
}

function getAll(name){
  return new Promise((resolve,reject)=>{
    const r=store(name).getAll();
    r.onsuccess=()=>resolve(r.result);
    r.onerror=()=>reject(r.error);
  });
}

function put(name,value){
  return new Promise((resolve,reject)=>{
    const r=store(name,"readwrite").put(value);
    r.onsuccess=()=>resolve(r.result);
    r.onerror=()=>reject(r.error);
  });
}

function add(name,value){
  return new Promise((resolve,reject)=>{
    const r=store(name,"readwrite").add(value);
    r.onsuccess=()=>resolve(r.result);
    r.onerror=()=>reject(r.error);
  });
}

function remove(name,id){
  return new Promise((resolve,reject)=>{
    const r=store(name,"readwrite").delete(id);
    r.onsuccess=()=>resolve();
    r.onerror=()=>reject(r.error);
  });
}

function deleteChatMessages(chatId){
  return new Promise((resolve,reject)=>{
    const tx=db.transaction("messages","readwrite");
    const s=tx.objectStore("messages");
    const idx=s.index("chatId");
    const r=idx.openCursor(IDBKeyRange.only(chatId));
    r.onsuccess=()=>{
      const cursor=r.result;
      if(cursor){cursor.delete();cursor.continue();}
    };
    tx.oncomplete=resolve;
    tx.onerror=()=>reject(tx.error);
  });
}

function safeText(value){
  return String(value ?? "");
}

function initials(name){
  return safeText(name).trim().slice(0,1).toUpperCase() || "C";
}

function formatTime(time){
  return new Date(time).toLocaleTimeString("hi-IN",{
    hour:"2-digit",minute:"2-digit"
  });
}

function latestMessage(chatId){
  return messages.filter(m=>m.chatId===chatId)
    .sort((a,b)=>b.time-a.time)[0];
}

function sortContacts(){
  contacts.sort((a,b)=>{
    const am=latestMessage(a.id);
    const bm=latestMessage(b.id);
    return (bm?.time||b.createdAt)-(am?.time||a.createdAt);
  });
}

function renderContacts(){
  sortContacts();
  const query=$("searchInput").value.trim().toLowerCase();
  const list=$("contactList");
  list.replaceChildren();

  const filtered=contacts.filter(c=>{
    const m=latestMessage(c.id);
    return c.name.toLowerCase().includes(query) ||
      safeText(m?.text).toLowerCase().includes(query);
  });

  if(!filtered.length){
    const div=document.createElement("div");
    div.className="emptycontacts";
    div.textContent=contacts.length
      ?"कोई चैट नहीं मिली।"
      :"अभी कोई चैट नहीं है। ＋ दबाकर नई चैट बनाएँ।";
    list.appendChild(div);
    return;
  }

  filtered.forEach(c=>{
    const row=document.createElement("div");
    row.className="contact"+(c.id===activeChat?" active":"");

    const avatar=document.createElement("div");
    avatar.className="avatar";
    avatar.textContent=initials(c.name);

    const info=document.createElement("div");
    info.className="contactinfo";

    const name=document.createElement("div");
    name.className="contactname";
    name.textContent=c.name;

    const preview=document.createElement("div");
    preview.className="preview";
    const m=latestMessage(c.id);
    preview.textContent=m?(m.text || m.fileName || "फाइल"):"अभी कोई मैसेज नहीं";

    info.append(name,preview);
    row.append(avatar,info);
    row.addEventListener("click",()=>openChat(c.id));
    list.appendChild(row);
  });
}

async function refresh(){
  contacts=await getAll("contacts");
  messages=await getAll("messages");
  renderContacts();
  if(activeChat) renderMessages();
}

function openChat(id){
  activeChat=id;
  const contact=contacts.find(c=>c.id===id);
  if(!contact)return;

  $("chatName").textContent=contact.name;
  $("chatAvatar").textContent=initials(contact.name);
  $("welcomeArea").style.display="none";
  $("conversation").style.display="flex";
  app.classList.add("chat-open");
  renderContacts();
  renderMessages();
  $("messageInput").focus();
}

function renderMessages(){
  const area=$("messages");
  area.replaceChildren();
  const items=messages.filter(m=>m.chatId===activeChat)
    .sort((a,b)=>a.time-b.time);

  if(!items.length){
    const empty=document.createElement("div");
    empty.className="welcome";
    empty.textContent="यह चैट खाली है। पहला मैसेज लिखें।";
    area.appendChild(empty);
    return;
  }

  let previousDay="";
  items.forEach(m=>{
    const day=new Date(m.time).toLocaleDateString("hi-IN");
    if(day!==previousDay){
      const label=document.createElement("div");
      label.className="daylabel";
      label.textContent=day;
      area.appendChild(label);
      previousDay=day;
    }

    const bubble=document.createElement("div");
    bubble.className="bubble outgoing";

    if(m.text){
      const text=document.createElement("div");
      text.textContent=m.text;
      bubble.appendChild(text);
    }

    if(m.file){
      const file=m.file;
      if(file.type && file.type.startsWith("image/")){
        const img=document.createElement("img");
        img.alt=m.fileName || "फोटो";
        const url=URL.createObjectURL(file);
        img.src=url;
        img.onload=()=>URL.revokeObjectURL(url);
        bubble.appendChild(img);
      }

      const link=document.createElement("a");
      const url=URL.createObjectURL(file);
      link.href=url;
      link.download=m.fileName || "download";
      link.textContent="📎 "+(m.fileName || "फाइल डाउनलोड करें");
      link.target="_blank";
      link.rel="noopener";
      link.addEventListener("click",()=>{
        setTimeout(()=>URL.revokeObjectURL(url),60000);
      });
      bubble.appendChild(link);
    }

    const time=document.createElement("div");
    time.className="msgtime";
    time.textContent=formatTime(m.time)+"  ✓";
    bubble.appendChild(time);
    area.appendChild(bubble);
  });

  area.scrollTop=area.scrollHeight;
}

async function createChat(){
  const name=prompt("नए चैट का नाम लिखें:");
  if(name===null)return;
  const clean=name.trim();
  if(!clean){alert("कृपया नाम लिखें।");return;}

  const contact={
    id:crypto.randomUUID(),
    name:clean,
    createdAt:Date.now()
  };

  try{
    await add("contacts",contact);
    await refresh();
    openChat(contact.id);
  }catch(e){
    console.error(e);
    alert("चैट नहीं बन सकी। ब्राउज़र स्टोरेज जाँचें।");
  }
}

async function sendMessage(){
  if(busy)return;
  if(!activeChat){alert("पहले नई चैट बनाएँ।");return;}

  const text=$("messageInput").value.trim();
  if(!text && !pendingFiles.length)return;

  busy=true;
  $("sendBtn").disabled=true;

  try{
    for(const file of pendingFiles){
      await add("messages",{
        chatId:activeChat,
        text:"",
        file:file,
        fileName:file.name,
        time:Date.now()
      });
    }

    if(text){
      await add("messages",{
        chatId:activeChat,
        text,
        time:Date.now()
      });
    }

    $("messageInput").value="";
    $("messageInput").style.height="auto";
    pendingFiles=[];
    $("fileInput").value="";
    await refresh();
    openChat(activeChat);
  }catch(e){
    console.error(e);
    alert("मैसेज सेव नहीं हो सका। स्टोरेज भर गया हो सकता है। छोटी फाइल से प्रयास करें।");
  }finally{
    busy=false;
    $("sendBtn").disabled=false;
  }
}

async function deleteActiveChat(){
  if(!activeChat)return;
  if(!confirm("क्या इस चैट और इसके सभी मैसेज को हटाना चाहते हैं?"))return;

  const id=activeChat;
  try{
    await deleteChatMessages(id);
    await remove("contacts",id);
    activeChat=null;
    $("conversation").style.display="none";
    $("welcomeArea").style.display="flex";
    app.classList.remove("chat-open");
    await refresh();
  }catch(e){
    console.error(e);
    alert("चैट हटाई नहीं जा सकी।");
  }
}

$("newChatBtn").addEventListener("click",createChat);
$("searchInput").addEventListener("input",renderContacts);
$("sendBtn").addEventListener("click",sendMessage);
$("deleteChatBtn").addEventListener("click",deleteActiveChat);
$("backBtn").addEventListener("click",()=>{
  app.classList.remove("chat-open");
});

$("messageInput").addEventListener("input",()=>{
  const el=$("messageInput");
  el.style.height="auto";
  el.style.height=Math.min(el.scrollHeight,120)+"px";
});

$("messageInput").addEventListener("keydown",e=>{
  if(e.key==="Enter" && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});

$("fileInput").addEventListener("change",e=>{
  const files=Array.from(e.target.files||[]);
  if(!files.length)return;

  const maxSize=10*1024*1024;
  const accepted=files.filter(f=>f.size<=maxSize);
  const rejected=files.filter(f=>f.size>maxSize);

  pendingFiles.push(...accepted);

  if(rejected.length){
    alert("10 MB से बड़ी फाइल नहीं जोड़ी गई: "+rejected.map(f=>f.name).join(", "));
  }

  if(pendingFiles.length){
    $("messageInput").placeholder=
      pendingFiles.length+" फाइल चुनी गईं। चाहें तो मैसेज भी लिखें...";
  }
});

$("clearBtn").addEventListener("click",async()=>{
  if(!confirm("सभी लोकल चैट और मैसेज स्थायी रूप से हटाएँ?"))return;
  try{
    const tx=db.transaction(["contacts","messages"],"readwrite");
    tx.objectStore("contacts").clear();
    tx.objectStore("messages").clear();
    tx.oncomplete=async()=>{
      activeChat=null;
      $("conversation").style.display="none";
      $("welcomeArea").style.display="flex";
      app.classList.remove("chat-open");
      await refresh();
    };
    tx.onerror=()=>alert("डेटा हटाने में समस्या हुई।");
  }catch(e){
    console.error(e);
    alert("डेटा हटाया नहीं जा सका।");
  }
});

(async function init(){
  try{
    if(!("indexedDB" in window)){
      throw new Error("IndexedDB उपलब्ध नहीं है");
    }
    db=await openDB();
    await refresh();
  }catch(e){
    console.error(e);
    document.body.innerHTML=
      '<div style="padding:25px;font-family:Arial"><h2>चैट शुरू नहीं हो सकी</h2><p>आपका ब्राउज़र लोकल स्टोरेज नहीं खोल पा रहा है। ब्राउज़र सेटिंग्स जाँचें और पेज दोबारा खोलें।</p></div>';
  }
})();
</script>
</body>
</html>
