<head>

    <!-- ==============================
         PWA SETTINGS
    ============================== -->

    <style>

        /* ==============================
           MIRROR / GLASS DESIGN
        ============================== */

        *{
            box-sizing:border-box;
        }

        body{
            background:
                linear-gradient(
                    135deg,
                    #e8f0f8,
                    #ffffff,
                    #dfeaf5,
                    #f8fbff
                );

            color:#222;
        }


        /* ==============================
           HEADER
        ============================== */

        .top-header{
            background:
                linear-gradient(
                    135deg,
                    rgba(255,153,51,.90),
                    rgba(255,255,255,.95),
                    rgba(19,136,8,.85)
                );

            backdrop-filter:blur(15px);
            -webkit-backdrop-filter:blur(15px);

            border-bottom:1px solid rgba(255,255,255,.8);

            box-shadow:
                0 8px 30px rgba(0,0,0,.15),
                inset 0 1px 0 rgba(255,255,255,.8);
        }


        .logo{
            display:flex;
            align-items:center;
            gap:15px;
        }


        .portal-logo{
            width:65px;
            height:65px;
            object-fit:cover;
            border-radius:50%;
            flex-shrink:0;

            border:4px solid rgba(255,255,255,.9);

            box-shadow:
                0 5px 18px rgba(0,0,0,.25),
                inset 0 0 10px rgba(255,255,255,.8);
        }


        .logo h1{
            margin:0;
        }


        .logo p{
            margin:3px 0 0;
            font-weight:bold;
        }


        /* ==============================
           TRICOLOR TITLE
        ============================== */

        .tricolor-title{
            background:linear-gradient(
                to bottom,
                #ff9933 0%,
                #ff9933 33%,
                #ffffff 33%,
                #ffffff 66%,
                #138808 66%,
                #138808 100%
            );

            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
            background-clip:text;

            font-weight:800;

            text-shadow:
                0 1px 2px rgba(0,0,0,.15);
        }


        /* ==============================
           NAVIGATION
        ============================== */

        .navbar{
            background:rgba(8,48,107,.88);

            backdrop-filter:blur(12px);
            -webkit-backdrop-filter:blur(12px);

            box-shadow:
                0 5px 20px rgba(0,0,0,.18);
        }


        .navbar a{
            transition:.25s;
        }


        .navbar a:hover{
            background:rgba(255,255,255,.16);
            transform:translateY(-2px);
        }


        /* ==============================
           SLIDER
        ============================== */

        .slider{
            width:100%;
            max-width:1100px;
            height:350px;
            margin:25px auto;

            overflow:hidden;

            border-radius:20px;

            border:1px solid rgba(255,255,255,.8);

            box-shadow:
                0 10px 35px rgba(0,0,0,.20),
                inset 0 1px 0 rgba(255,255,255,.8);

            position:relative;
        }


        .slider::after{
            content:"";
            position:absolute;
            inset:0;

            background:
                linear-gradient(
                    120deg,
                    rgba(255,255,255,.18),
                    transparent 45%,
                    rgba(255,255,255,.08)
                );

            pointer-events:none;
        }


        .slides{
            display:flex;
            width:300%;
            height:100%;
            animation:slide 12s infinite;
        }


        .slides img{
            width:33.3333%;
            height:100%;
            display:block;
            object-fit:cover;
        }


        @keyframes slide{

            0%{
                transform:translateX(0);
            }

            30%{
                transform:translateX(0);
            }

            35%{
                transform:translateX(-33.3333%);
            }

            65%{
                transform:translateX(-33.3333%);
            }

            70%{
                transform:translateX(-66.6666%);
            }

            95%{
                transform:translateX(-66.6666%);
            }

            100%{
                transform:translateX(0);
            }

        }


        /* ==============================
           JOIN GROUP MIRROR CARD
        ============================== */

        .join-group-hero{
            padding:12px;

            border-radius:22px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,153,51,.85),
                    rgba(255,255,255,.95),
                    rgba(19,136,8,.85)
                );

            box-shadow:
                0 12px 35px rgba(0,0,0,.18),
                inset 0 1px 0 rgba(255,255,255,.9);

            backdrop-filter:blur(15px);
            -webkit-backdrop-filter:blur(15px);
        }


        .join-group-link{
            display:flex;
            align-items:center;

            gap:20px;

            padding:20px 25px;

            text-decoration:none;

            color:#08306b;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,.92),
                    rgba(255,255,255,.65)
                );

            border-radius:16px;

            border:1px solid rgba(255,255,255,.8);

            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.9),
                0 5px 20px rgba(0,0,0,.10);

            transition:.3s;
        }


        .join-group-link:hover{
            transform:translateY(-4px);

            box-shadow:
                0 12px 28px rgba(0,0,0,.20),
                inset 0 1px 0 rgba(255,255,255,.9);
        }


        .join-group-logo{
            width:90px;
            height:90px;
            min-width:90px;

            border-radius:50%;

            object-fit:cover;

            border:5px solid white;

            box-shadow:
                0 0 0 3px #ff9933,
                0 0 0 6px #ffffff,
                0 0 0 9px #138808,
                0 8px 20px rgba(0,0,0,.25);
        }


        .join-group-text{
            flex:1;
        }


        .join-group-text h2{
            margin:0 0 7px;

            font-size:30px;

            font-weight:800;

            color:#0d47a1;
        }


        .join-group-text p{
            margin:0;

            font-size:16px;

            line-height:1.5;

            color:#333;
        }


        /* ==============================
           DASHBOARD GLASS CARDS
        ============================== */

        .dashboard{
            background:
                rgba(255,255,255,.55);

            backdrop-filter:blur(15px);
            -webkit-backdrop-filter:blur(15px);

            border:1px solid rgba(255,255,255,.8);

            border-radius:22px;

            padding:25px;

            box-shadow:
                0 10px 30px rgba(0,0,0,.12),
                inset 0 1px 0 rgba(255,255,255,.9);
        }


        .dashboard a{
            text-decoration:none;
        }


        .dashboard button{
            border-radius:14px !important;

            border:1px solid rgba(255,255,255,.6) !important;

            box-shadow:
                0 7px 18px rgba(0,0,0,.18),
                inset 0 1px 0 rgba(255,255,255,.35);

            transition:.3s !important;
        }


        .dashboard button:hover{
            transform:
                translateY(-4px)
                scale(1.02);

            box-shadow:
                0 12px 25px rgba(0,0,0,.25),
                inset 0 1px 0 rgba(255,255,255,.5);
        }


        /* ==============================
           FOOTER
        ============================== */

        .copyright{
            background:
                linear-gradient(
                    135deg,
                    rgba(255,153,51,.90),
                    rgba(255,255,255,.95),
                    rgba(19,136,8,.90)
                );

            color:#08306b;

            font-weight:bold;

            border-top:1px solid rgba(255,255,255,.8);

            box-shadow:
                0 -8px 25px rgba(0,0,0,.12);
        }


        /* ==============================
           MOBILE
        ============================== */

        @media(max-width:600px){

            .join-group-link{
                gap:15px;
                padding:15px;
            }


            .join-group-logo{
                width:72px;
                height:72px;
                min-width:72px;
            }


            .join-group-text h2{
                font-size:22px;
            }


            .join-group-text p{
                font-size:14px;
            }


            .slider{
                height:230px;
                width:94%;
            }


            .logo{
                gap:10px;
            }


            .portal-logo{
                width:55px;
                height:55px;
            }


            .logo h1{
                font-size:17px;
            }


            .logo p{
                font-size:13px;
            }

        }

    </style>

</head>
