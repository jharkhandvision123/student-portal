    <style>


        /* ==============================
           LOGO
        ============================== */

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }


        .portal-logo {
            width: 65px;
            height: 65px;
            object-fit: cover;
            border-radius: 50%;
            flex-shrink: 0;
        }


        .logo h1 {
            margin: 0;
        }


        .logo p {
            margin: 3px 0 0;
        }



        /* ==============================
           TRICOLOR TITLE
        ============================== */

        .tricolor-title {

            background: linear-gradient(
                to bottom,
                #ff9933 0%,
                #ff9933 33%,
                #ffffff 33%,
                #ffffff 66%,
                #138808 66%,
                #138808 100%
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;

            font-weight: 800;

            text-shadow:
                0 1px 1px rgba(0,0,0,0.08);
        }



        /* ==============================
           SLIDER
        ============================== */

        .slider {

            width: 100%;
            max-width: 1100px;
            height: 350px;

            margin: 20px auto;

            overflow: hidden;

            border-radius: 12px;
        }


        .slides {

            display: flex;

            width: 300%;
            height: 100%;

            animation: slide 12s infinite;
        }


        .slides img {

            width: 33.3333%;
            height: 100%;

            display: block;

            object-fit: cover;
        }


        @keyframes slide {

            0% {
                transform: translateX(0);
            }

            30% {
                transform: translateX(0);
            }

            35% {
                transform: translateX(-33.3333%);
            }

            65% {
                transform: translateX(-33.3333%);
            }

            70% {
                transform: translateX(-66.6666%);
            }

            95% {
                transform: translateX(-66.6666%);
            }

            100% {
                transform: translateX(0);
            }

        }



        /* ==============================
           JOIN GROUP TRICOLOR SECTION
        ============================== */

        .join-group-hero {

            padding: 12px;

            border-radius: 18px;

            background: linear-gradient(
                90deg,
                #ff9933 0%,
                #ffffff 50%,
                #138808 100%
            );

            box-shadow:
                0 5px 16px rgba(0,0,0,.15);
        }


        .join-group-link {

            display: flex;

            align-items: center;

            gap: 20px;

            padding: 18px 22px;

            text-decoration: none;

            color: #08306b;

            background: white;

            border-radius: 14px;
        }


        .join-group-logo {

            width: 90px;
            height: 90px;

            min-width: 90px;

            border-radius: 50%;

            object-fit: cover;

            border: 5px solid white;

            box-shadow:

                0 0 0 3px #ff9933,

                0 0 0 6px #ffffff,

                0 0 0 9px #138808;
        }


        .join-group-text {

            flex: 1;
        }


        .join-group-text h2 {

            margin: 0 0 7px;

            font-size: 30px;

            font-weight: 800;

            color: #0d47a1;
        }


        .join-group-text p {

            margin: 0;

            font-size: 16px;

            line-height: 1.5;

            color: #333;
        }


        .join-group-link:hover {

            transform: translateY(-2px);
        }



        /* ==============================
           MOBILE JOIN GROUP
        ============================== */

        @media(max-width:600px) {

            .join-group-link {

                gap: 15px;

                padding: 15px;
            }


            .join-group-logo {

                width: 72px;
                height: 72px;

                min-width: 72px;
            }


            .join-group-text h2 {

                font-size: 22px;
            }


            .join-group-text p {

                font-size: 14px;
            }

        }

/* =========================================
   REALISTIC MIRROR STYLE
   VISUAL ONLY — FUNCTIONALITY UNCHANGED
========================================= */

body{
    background:
        linear-gradient(
            135deg,
            #7d8b94 0%,
            #e9eef1 12%,
            #9aa8b1 25%,
            #ffffff 38%,
            #8998a2 52%,
            #f5f8fa 66%,
            #9ba9b2 80%,
            #ffffff 100%
        );

    background-attachment:fixed;
}


/* MIRROR SURFACE */

.top-header,
.slider,
.join-group-hero,
.dashboard,
.copyright{
    position:relative;
    overflow:hidden;
}


/* REFLECTIVE LIGHT */

.top-header::after,
.slider::after,
.join-group-hero::after,
.dashboard::after,
.copyright::after{

    content:"";

    position:absolute;

    top:-80%;
    left:-80%;

    width:45%;
    height:260%;

    background:linear-gradient(
        90deg,
        transparent 0%,
        rgba(255,255,255,.18) 35%,
        rgba(255,255,255,.75) 50%,
        rgba(255,255,255,.18) 65%,
        transparent 100%
    );

    transform:rotate(20deg);

    pointer-events:none;

    z-index:20;

    animation:mirrorLight 7s ease-in-out infinite;
}


@keyframes mirrorLight{

    0%{
        left:-80%;
    }

    45%{
        left:135%;
    }

    100%{
        left:135%;
    }
}


/* HEADER MIRROR */

.top-header{

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.90),
            rgba(145,158,168,.70),

}


/* NAVIGATION */

}


/* SLIDER */

/* JOIN GROUP */

.join-group-link{

/* GROUP LOGO */

}


/* DASHBOARD */

.dashboard{

        0 12px 30px rgba(0,0,0,.25);
}


/* DASHBOARD BUTTONS */

}


/* FOOTER */

/* MOBILE */

@media(max-width:600px){

    .top-header::after,
    .slider::after,

    }

}
