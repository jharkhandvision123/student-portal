        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #111827;
        }

        header {
            background: linear-gradient(90deg, #ff9933, #ffffff, #138808);
            padding: 22px 15px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        .container {
            max-width: 850px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .search-box {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: 1px solid #aaa;
            border-radius: 10px;
            outline: none;
        }

        .search-box:focus {
            border-color: #2563eb;
        }

        .result {
            margin-top: 15px;
        }

        .option {
            background: white;

            cursor: pointer;
        }

        .option:hover {
            background: #f0f7ff;
        }

        .option strong {
            display: block;
            font-size: 18px;
        }

        .option small {
            color: #666;
        }

        .editor {
            display: none;
            margin-top: 20px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #ddd;

        .editor h2 {
            margin-top: 0;

            background: #f8fafc;
            padding: 12px;

        input[type="file"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        .print-btn {
            background: #16a34a;
            color: white;
            width: 100%;
            margin-top: 15px;
        }

        .print-btn:hover {
            background: #15803d;
        }

        .preview-title {
            margin-top: 25px;
            margin-bottom: 10px;
        }

        .a4-preview {
            width: 210mm;
            min-height: 297mm;
            background: white;
            margin: auto;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 8px rgba(0,0,0,0.2);
        }

        .photo {
            position: absolute;
            object-fit: cover;
        }

        .message {
            margin-top: 10px;

            font-weight: bold;
        }

        @media (max-width: 750px) {
            .a4-preview {
                transform-origin: top left;
                transform: scale(0.45);
                margin-bottom: -160mm;
            }
        }

        @media print {
            @page {
                size: A4 portrait;
                margin: 0;
            }

            body {
                background: white;
            }

            header,
            .container > *:not(.editor),
            .editor > *:not(.print-area) {
                display: none !important;
            }

            .editor {
                display: block !important;
                padding: 0;
                margin: 0;
                border: 0;

            }

            .a4-preview {

                height: 297mm;

                margin: 0;
                box-shadow: none;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Photo Print System</h1>
</header>

<div class="container">

    <input
        type="text"
        id="searchInput"
        class="search-box"
        placeholder="Search करें: Aadhaar Card, Passport Size Photo, PAN Card"
        autocomplete="off"
    >

    <div id="result" class="result"></div>

    <div id="editor" class="editor">

        <div class="info">
            <div><strong>Size:</strong> <span id="documentSize"></span></div>
            <div><strong>A4 में फोटो:</strong> <span id="photoCount"></span></div>
        </div>

        <input
            type="file"
            id="photoInput"
            accept="image/*"
        >

        <div id="message" class="message"></div>

        <div class="print-area">
            <h3 class="preview-title">A4 Preview</h3>

            <div id="a4Preview" class="a4-preview"></div>

            <button
                class="print-btn"
                onclick="printPage()"
            >
                🖨️ Print

                selectDocument(document);

            result.appendChild(option);

        if (matches.length === 0) {

        a4Preview.innerHTML = "";
